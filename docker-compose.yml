services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celix_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./AppWeb:/var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: celix_db
      DB_USERNAME: postgres
      DB_PASSWORD: admin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - celix_network

  db:
    image: postgres:18
    container_name: celix_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: celix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - celix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d celix_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - celix_network

volumes:
  celix_pgdata:
    driver: local

networks:
  celix_network:
    driver: bridge
